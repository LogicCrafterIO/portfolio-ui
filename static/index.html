<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4Pillar Options Book</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="mark">4P</div>
    <div>
      <h1>Options Book</h1>
      <p class="subtle">Realised &middot; Pre session &middot; Actionable watchlist</p>
    </div>
  </div>

  <div class="topbar-actions">
    <label class="field inline">
      <span>As of</span>
      <input type="date" id="asof-input" autocomplete="off">
    </label>
    <button class="btn ghost" id="btn-today" title="Reset the as-of date to today">Today</button>
    <button class="btn" id="btn-refresh" title="Pull delayed (~15 min) quotes from yfinance">
      <span class="spin" hidden></span><span class="label">Pull live data</span>
    </button>
    <button class="btn ghost" id="btn-export"
      title="Download your workbook (example_sheet.xlsx) with the current numbers written into it — same three tabs, same styling">Export .xlsx</button>
    <button class="btn ghost icon" id="btn-settings" title="Settings">&#9881;</button>
  </div>
</header>

<nav class="tabbar" id="tabbar">
  <button class="tab active" data-tab="presession">Pre session</button>
  <button class="tab" data-tab="realised">Realised</button>
  <button class="tab" data-tab="watchlist">Actionable watchlist</button>
  <div class="tabbar-right">
    <span id="quote-status" class="pill" title="Last live-quote pull"></span>
    <span id="store-status" class="pill subtle" title="Where the data lives"></span>
  </div>
</nav>

<main>
  <section id="panel-presession" class="panel">
    <div id="ps-kpis" class="kpi-strip"></div>
    <div id="ps-months" class="card"></div>
    <div class="section-head">
      <h2>Open positions</h2>
      <div class="row-gap">
        <span class="subtle" id="ps-pos-hint"></span>
        <button class="btn" data-act="add-position">+ Position</button>
      </div>
    </div>
    <div id="ps-positions"></div>
  </section>

  <section id="panel-realised" class="panel" hidden>
    <div id="rl-kpis" class="kpi-strip"></div>
    <div class="card">
      <div class="card-head">
        <h2>Closed trades</h2>
        <div class="filters">
          <label class="field inline"><span>Date on</span>
            <select id="rl-datefield">
              <option value="exit_date">Exit date</option>
              <option value="entry_date">Entry date</option>
              <option value="book_month">Booking month</option>
            </select>
          </label>
          <label class="field inline"><span>From</span><input type="date" id="rl-from"></label>
          <label class="field inline"><span>To</span><input type="date" id="rl-to"></label>
          <label class="field inline"><span>Ticker</span><input type="text" id="rl-ticker" placeholder="all" size="6"></label>
          <button class="btn ghost small" data-preset="all">All</button>
          <button class="btn ghost small" data-preset="month">This month</button>
          <button class="btn ghost small" data-preset="90">Last 90d</button>
          <button class="btn ghost small" data-preset="ytd">YTD</button>
          <button class="btn ghost small" data-act="toggle-legs" id="rl-legs-toggle">Legs: shown</button>
          <button class="btn ghost small" data-act="merge-trades" id="rl-merge" disabled
            title="Select two or more trades of the same ticker to fold them into one">Merge selected</button>
          <button class="btn" data-act="add-trade">+ Trade</button>
        </div>
      </div>
      <div class="table-wrap" id="rl-table"></div>
      <p class="footnote" id="rl-footnote"></p>
    </div>
  </section>

  <section id="panel-watchlist" class="panel" hidden>
    <div class="card">
      <div class="card-head">
        <div>
          <h2>Actionable watchlist</h2>
          <p class="subtle">Type a ticker straight into a cell and press <kbd>Enter</kbd> — commas and
            spaces work too. Click the <b>&times;</b> on a chip to take it out. Nothing opens a dialog.</p>
        </div>
        <div class="row-gap">
          <span class="subtle" id="wl-status"></span>
          <button class="btn ghost small" data-act="toggle-wl-notes" id="wl-notes-toggle"
            title="Show the sub-sector / comment under each ticker">Notes: off</button>
        </div>
      </div>
      <div id="wl-groups"></div>
    </div>
  </section>
</main>

<div id="modal-root" hidden>
  <div class="modal-backdrop" data-act="modal-close"></div>
  <div class="modal" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="btn ghost icon" data-act="modal-close" aria-label="Close">&times;</button>
    </header>
    <form id="modal-form" class="modal-body" autocomplete="off"></form>
    <footer class="modal-foot">
      <span class="modal-error" id="modal-error"></span>
      <button class="btn ghost" type="button" data-act="modal-close">Cancel</button>
      <button class="btn" type="submit" form="modal-form" id="modal-submit">Save</button>
    </footer>
  </div>
</div>

<div id="toast-root" class="toast-root"></div>
<script src="/static/app.js"></script>
</body>
</html>
